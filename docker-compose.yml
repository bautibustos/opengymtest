name: opengym

# NOTE (railway branch): the exercise media is baked into the web image at build time
# (see web/Dockerfile) instead of coming from a sidecar + shared volume, because Railway
# has no shared volume between services. Run `docker compose up --build` locally so the
# image with the media and the nginx template is actually rebuilt.

services:
  # Passkey auth + per-user data (Node, no framework).
  # image: prebuilt (docker compose pull). build: from source (docker compose up --build).
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000            # internal port (nginx proxies here) — do not change
      - DATA_DIR=/data
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP

  # Builds the React frontend (multi-stage), bakes in the exercise media, and serves it,
  # proxying /api → api. Single origin for passkeys.
  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      - PORT=80             # nginx listen port inside the container
      - API_UPSTREAM=api:3000
    ports:
      - "${WEB_PORT:-8080}:80"
